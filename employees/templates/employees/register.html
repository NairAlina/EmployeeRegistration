<!DOCTYPE html>
<html>
<head>
    <title>Employee Registration</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 35px 20px;
            min-height: 100vh;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                    135deg,
                    #667eea,
                    #764ba2
            );
        }


        /* MAIN APPLICATION CARD */
        .page-container {
            max-width: 1050px;
            margin: 0 auto;

            padding: 28px 35px 45px;

            background: rgba(255, 255, 255, 0.96);

            border-radius: 20px;

            box-shadow:
                    0 15px 40px rgba(0, 0, 0, 0.18);
        }


        /* HEADER */
        .header {
            text-align: center;

            padding: 28px 20px;

            margin-bottom: 30px;

            border-radius: 14px;

            background: linear-gradient(
                    135deg,
                    #667eea,
                    #764ba2
            );

            box-shadow:
                    0 6px 18px rgba(0, 0, 0, 0.12);
        }


        /* TITLE */
        .header h1 {
            margin: 0;

            color: white;

            font-size: 30px;
        }


        /* SUBTITLE */
        .header p {
            margin: 8px 0 0;

            color: rgba(255, 255, 255, 0.9);

            font-size: 14px;
        }

        /* FORM CARD */
        form {
            max-width: 650px;

            margin: 0 auto;

            padding: 30px 35px;

            background: #ffffff;

            border-radius: 16px;

            box-shadow:
                    0 6px 20px rgba(0, 0, 0, 0.08);
        }

        /* LABELS */
        label {
            display: block;

            margin-bottom: 8px;

            color: #34495e;

            font-size: 15px;
            font-weight: bold;
        }

        /* INPUTS */
        input,
        textarea {
            width: 100%;

            padding: 13px 14px;

            margin-bottom: 22px;

            border: 1px solid #d9ddea;

            border-radius: 9px;

            background: #f8f9ff;

            color: #333;

            font-size: 14px;

            outline: none;

            transition: all 0.25s ease;
        }

        /* INPUT HOVER */
        input:hover,
        textarea:hover {
            border-color: #aab4e8;
            background: #ffffff;
        }

        /* INPUT FOCUS */
        input:focus,
        textarea:focus {
            border-color: #667eea;

            background: white;

            box-shadow:
                    0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        /* TEXTAREA */
        textarea {
            height: 90px;
            resize: vertical;
        }

        /* FILE INPUT */
        input[type="file"] {
            padding: 10px;

            background: #f8f9ff;

            cursor: pointer;
        }

        /* SUBMIT BUTTON */
        button {
            width: 100%;

            padding: 14px;

            margin-top: 5px;

            border: none;

            border-radius: 9px;

            background: linear-gradient(
                    135deg,
                    #667eea,
                    #764ba2
            );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                    0 6px 15px rgba(102, 126, 234, 0.3);

            transition: all 0.25s ease;
        }

        /* BUTTON HOVER */
        button:hover {
            transform: translateY(-2px);

            box-shadow:
                    0 9px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }



    </style>
</head>

<body>

<div class="page-container">

    <div class="header">
        <h1>Employee Registration</h1>
        <p>Register and manage employee information</p>
    </div>

    <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <label>Employee ID:</label>
    <input type="text" name="employee_id" required>
    <br><br>

    <label>Full Name:</label>
    <input type="text" name="full_name" required>
    <br><br>

    <label>Email:</label>
    <input type="email" name="email" required>
    <br><br>

    <label>Phone:</label>
    <input type="text" name="phone" pattern="[0-9]{10}" required>
    <br><br>

    <label>Department:</label>
    <input type="text" name="department" required>
    <br><br>

    <label>Designation:</label>
    <input type="text" name="designation" required>
    <br><br>

    <label>Salary:</label>
    <input type="number" name="salary" min="0" required>
    <br><br>

    <label>Joining Date:</label>
    <input type="date" name="joining_date" required>
    <br><br>

    <label>Address:</label>
    <textarea name="address" required></textarea>
    <br><br>

    <label>Profile Photo:</label>
    <input type="file" name="profile_photo" accept="image/*">
    <br><br>

    <button type="submit">Register Employee</button>

</form>
</div>
</body>
</html>
